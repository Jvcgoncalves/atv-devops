name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      MQTT_ENABLED: "false"
      VITE_API_MODE: mock
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Run CI checks
        run: npm run ci
